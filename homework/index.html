<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>운동 숙제 체크</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#F6F4EF; --card:#FFFFFF; --ink:#1D1F1E; --sub:#6B6F6C; --faint:#A3A6A2; --line:#E6E2DA;
  --accent:#E8552B; --accent-ink:#B83E1B; --accent-soft:#FDE9E2;
  --ok:#1F8A5B; --ok-soft:#E1F2E9; --part:#D98E1F; --part-soft:#FBEFD9; --none:#E2DED6;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 80px}
body.member .wrap{max-width:480px;padding-top:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.muted{color:var(--sub)} .small{font-size:13px}
h1{font-size:26px;line-height:1.25;letter-spacing:-.02em;font-weight:800}
h2{font-size:17px;font-weight:700;letter-spacing:-.01em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:12px;font-weight:600;font-size:14px;background:#EFECE6;transition:transform .08s,background .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:disabled{opacity:.6}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;color:#C0392B;border:1px solid #F0C9C3}
.btn.big{width:100%;padding:17px;font-size:17px;border-radius:14px}
.field{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none;font-size:15px}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.field{resize:vertical;min-height:80px}
.row{display:flex;gap:8px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.stack>*+*{margin-top:12px}
.banner{background:var(--part-soft);color:#7A4D08;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:16px}
.center-box{text-align:center;padding:60px 20px;color:var(--sub)}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#1D1F1E;color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- 회원 화면 ---------- */
.m-brand{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.02em;margin-bottom:8px}
.streak{display:inline-block;margin-top:12px;background:var(--accent-soft);color:var(--accent-ink);font-weight:700;font-size:14px;padding:6px 12px;border-radius:999px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:22px 0 14px}
.wd{text-align:center;font-size:12px;color:var(--sub)}
.wd i{display:block;width:30px;height:30px;margin:5px auto 0;border-radius:50%;background:var(--none)}
.wd.full i{background:var(--ok)} .wd.part i{background:var(--part)} .wd.rest i{background:transparent;border:2px dashed var(--line)}
.wd.today span{color:var(--ink);font-weight:800}
.wd.full i::after{content:"✓";color:#fff;font-weight:800;font-size:15px;line-height:30px;font-style:normal}
.seg{display:flex;background:#EAE6DF;border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:600;font-size:14px;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.prog .big{font-size:22px;font-weight:800;letter-spacing:-.02em}
.bar{height:10px;background:#EFECE6;border-radius:99px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.bar.done i{background:var(--ok)}
.hw-list{margin:14px 0}
.hw{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:10px;transition:background .15s,border-color .15s}
.hw .chk{flex:none;width:32px;height:32px;border-radius:10px;border:2px solid #CFCAC0;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:18px;transition:.15s}
.hw b{display:block;font-size:17px;font-weight:700}
.hw small{display:block;color:var(--sub);font-size:14px;margin-top:2px}
.hw.on{background:var(--ok-soft);border-color:#B9DFCB}
.hw.on .chk{background:var(--ok);border-color:var(--ok)}
.hw.on b{color:#14583A}
.feel{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0}
.feel button{padding:10px 2px;border-radius:12px;border:1.5px solid var(--line);background:#fff;text-align:center}
.feel button span{display:block;font-size:26px;line-height:1.1}
.feel button small{display:block;font-size:11px;color:var(--sub);margin-top:4px;white-space:nowrap}
.feel button.on{border-color:var(--accent);background:var(--accent-soft)}
.feel button.on small{color:var(--accent-ink);font-weight:700}
.sent-note{margin-top:12px;text-align:center;color:var(--ok);font-weight:600;font-size:14px}
.empty{text-align:center;padding:34px 18px;color:var(--sub);font-size:16px}
.celebrate{position:fixed;inset:0;background:rgba(246,244,239,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:40;animation:fade .2s}
.celebrate .e{font-size:76px;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.celebrate h2{font-size:24px;margin-top:10px}
.celebrate p{color:var(--sub);margin-top:6px}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
@keyframes fade{from{opacity:0}}

/* ---------- 트레이너 화면 ---------- */
.t-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.t-head h1{font-size:24px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--sub)}
.stat.ok b{color:var(--ok)} .stat.warn b{color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:860px){.grid2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}}
.sec-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mrow{display:grid;grid-template-columns:1fr auto;gap:6px 12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:8px;transition:border-color .15s}
.mrow:hover{border-color:#CFCAC0}
.mrow .nm{font-weight:700;font-size:16px}
.mrow .memo{font-size:13px;color:var(--sub)}
.dots{display:flex;gap:4px;align-items:center}
.dots i{width:12px;height:12px;border-radius:4px;background:var(--none)}
.dots i.full{background:var(--ok)} .dots i.part{background:var(--part)} .dots i.rest{background:transparent;border:1.5px dashed #D5D0C6}
.dots i.today{outline:2px solid var(--ink);outline-offset:1px}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:#EFECE6;color:var(--sub);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:13.5px;padding:6px 11px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.part{background:var(--part-soft);color:#94600F}
.pill.bad{background:#FDE3E0;color:#C0392B} .pill.wait{background:#EFECE6;color:var(--sub)}
.stats{grid-template-columns:repeat(4,1fr)}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat.part b{color:#94600F} .stat.bad b{color:#C0392B} .stat.wait b{color:var(--sub)}
.feed .item.bad{border-left:3px solid #E5857A;padding-left:10px}
.chip.full{background:var(--ok-soft);color:var(--ok)} .chip.part{background:var(--part-soft);color:#94600F} .chip.none{background:var(--accent-soft);color:var(--accent-ink)}
.mrow .last{grid-column:1/-1;font-size:13px;color:var(--sub);border-top:1px dashed var(--line);padding-top:8px;margin-top:2px}
.feed .item{padding:12px 0;border-bottom:1px solid var(--line)}
.feed .item:last-child{border-bottom:0}
.feed .who{font-weight:700}
.feed .cmt{margin-top:4px;font-size:14px;background:var(--bg);border-radius:10px;padding:8px 10px}
.back{font-weight:600;color:var(--sub);margin-bottom:12px;display:inline-flex;gap:4px;padding:6px 0}
.linkbox{background:var(--accent-soft);border:0}
.linkbox .field{background:#fff;font-size:13px}
a.btn{color:var(--ink);text-decoration:none}
.hwrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.hwrow:last-child{border-bottom:0}
.hwrow b{font-weight:700}
.days{display:flex;gap:5px;flex-wrap:wrap}
.days button{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:14px}
.days button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.g{border-collapse:collapse;font-size:12px;min-width:100%}
table.g th,table.g td{padding:6px 4px;text-align:center;white-space:nowrap}
table.g th:first-child,table.g td:first-child{text-align:left;padding-right:10px;position:sticky;left:0;background:#fff;max-width:130px;overflow:hidden;text-overflow:ellipsis}
table.g thead th{color:var(--sub);font-weight:600}
table.g th.today{color:var(--accent);font-weight:800}
.c{display:inline-block;width:20px;height:20px;border-radius:6px;line-height:20px;font-weight:800}
.c.y{background:var(--ok);color:#fff} .c.n{background:var(--none)} .c.p{border:1.5px dashed var(--line);background:transparent} .c.x{color:#D5D0C6}
.login{max-width:360px;margin:12vh auto 0}
html.embed body{background:transparent}
html.embed .wrap{max-width:none;padding:0 2px 40px}
html.embed .banner, html.embed .home-head{display:none}
html.embed .back{margin-top:0}
.spec{display:inline-block;margin-top:4px;font-weight:700;color:var(--accent-ink);font-size:15px}
.hw.on .spec{color:#14583A}
.note{display:block;margin-top:4px;color:var(--sub);font-size:13.5px}
.howto-btn{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:var(--sub);background:var(--bg);border-radius:8px;padding:5px 10px}
.howto{margin:-4px 0 10px;background:#fff;border:1.5px solid var(--line);border-top:0;border-radius:0 0 var(--r) var(--r);padding:12px 16px 14px 18px}
.howto ol,.hwrow ol{padding-left:20px;font-size:14.5px;line-height:1.6}
.howto li+li{margin-top:4px}
.hw.open{border-radius:var(--r) var(--r) 0 0;margin-bottom:0}
.hwrow.editing{background:var(--accent-soft);margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:10px}
.hwrow ol{margin-top:4px;color:var(--sub);font-size:13px}
.form-title{display:flex;justify-content:space-between;align-items:center}
.lbl{font-size:13px;color:var(--sub);font-weight:600;margin-bottom:6px}
.num-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.stepper button{width:44px;height:46px;font-size:22px;font-weight:600;color:var(--sub);flex:none}
.stepper button:active{background:var(--bg)}
.stepper input{flex:1;min-width:0;border:0;text-align:center;font-size:20px;font-weight:800;outline:none;height:46px;background:transparent}
.unit{display:flex;gap:4px;margin-top:6px}
.unit button{flex:1;padding:6px 0;border-radius:8px;border:1px solid var(--line);font-size:13px;font-weight:600;background:#fff}
.unit button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.quick button{padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--sub)}
.quick button:active{background:var(--accent-soft)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast"></div>

<script type="module">
/* =========================================================
   설정 — Supabase 연결 정보 (비워두면 '체험 모드'로 동작)
   Supabase 대시보드 > Project Settings > API 에서 복사
   ========================================================= */
const CONFIG = {
  SUPABASE_URL: "https://rhdpmpuvzvahinbgnksa.supabase.co",
  SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJoZHBtcHV2enZhaGluYmdua3NhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQzMjk3NTUsImV4cCI6MjEwOTkwNTc1NX0.2Lkj0hr3llBekAuwoDc2Ox-3EaJhgxDsa_UFO9XLpjs",
  CENTER_NAME: "좋음PT",
};

const EMBED = new URLSearchParams(location.search).has("embed");
if (EMBED) document.documentElement.classList.add("embed");

/* ---------- 공통 유틸 ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const app = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => ymd(new Date());
const DOW = ["일", "월", "화", "수", "목", "금", "토"];
const WEEK_ORDER = [1, 2, 3, 4, 5, 6, 0];
const fmtDate = s => { const d = parseYmd(s); return `${d.getMonth() + 1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`; };
const relDay = s => { const n = Math.round((parseYmd(today()) - parseYmd(s)) / 86400000); return n === 0 ? "오늘" : n === 1 ? "어제" : `${n}일 전`; };
const daysLabel = days => !days || !days.length ? "매일" : WEEK_ORDER.filter(d => days.includes(d)).map(d => DOW[d]).join("·");
const hwSpec = h => [h.sets ? `${h.sets}세트` : "", h.reps ? `${h.reps}${h.unit || "회"}` : ""].filter(Boolean).join(" × ");
const howSteps = t => String(t || "").split(/\n+/).map(x => x.replace(/^\s*(\d+[.)]|[-•·*])\s*/, "").trim()).filter(Boolean);
const FEEL = [null,
  { e: "😫", t: "힘들어요" }, { e: "😕", t: "조금 힘듦" }, { e: "🙂", t: "보통" },
  { e: "😊", t: "좋아요" }, { e: "💪", t: "최고!" }];
const randTok = () => { const a = new Uint8Array(12); crypto.getRandomValues(a); return [...a].map(b => b.toString(16).padStart(2, "0")).join(""); };
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : randTok());

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast("복사했어요"); return; } catch (e) {}
  const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast("복사했어요"); } catch (e) { toast("복사가 안 돼요. 직접 선택해서 복사해주세요"); }
  ta.remove();
}
const loading = (msg = "불러오는 중…") => `<div class="center-box"><div class="spinner"></div>${msg}</div>`;
const errorBox = msg => `<div class="center-box"><div style="font-size:40px;margin-bottom:10px">😥</div>${msg}</div>`;

/* ---------- 숙제 일정 계산 ---------- */
const createdDay = h => h.created_at ? ymd(new Date(h.created_at)) : "0000-00-00";
const isScheduled = (h, ds) => ds >= createdDay(h) && (!h.days || !h.days.length || h.days.includes(parseYmd(ds).getDay()));
function dayStatus(hws, logSet, ds) {
  const sched = hws.filter(h => isScheduled(h, ds));
  if (!sched.length) return { status: "rest", done: 0, total: 0 };
  const done = sched.filter(h => logSet.has(h.id + "|" + ds)).length;
  return { status: done === sched.length ? "full" : done ? "part" : "none", done, total: sched.length };
}
function streak(hws, logSet) {
  let n = 0, d = new Date();
  for (let i = 0; i < 90; i++, d = addDays(d, -1)) {
    const st = dayStatus(hws, logSet, ymd(d)).status;
    if (st === "full") n++;
    else if (st === "rest") continue;
    else if (i === 0) continue;   // 오늘은 아직 진행 중이라 끊지 않음
    else break;
  }
  return n;
}

/* =========================================================
   데이터 저장소 1) 체험 모드 — 이 브라우저(localStorage)에만 저장
   ========================================================= */
function demoBackend() {
  const KEY = "hw_demo_v4"; let mem = null;
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) {} };
  const db = () => {
    // 매번 저장소에서 다시 읽기 (같은 기기의 다른 탭에서 회원 화면을 체크한 내용도 보이도록)
    try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) mem = s; } catch (e) {}
    if (!mem) { mem = seed(); save(); }
    return mem;
  };
  function seed() {
    const created = addDays(new Date(), -10).toISOString();
    const m = { id: uid(), name: "김예시 (샘플)", memo: "허리 통증 · 주 2회 PT", token: randTok(), active: true, created_at: created };
    const hs = [["버드독", 3, 10, "회", "좌우 번갈아, 허리 꺾지 않기", []], ["글루트 브릿지", 3, 15, "회", "엉덩이에 힘 주고 2초 멈추기", [1, 3, 5]], ["폼롤러 흉추 스트레칭", 1, 2, "분", "", []]]
      .map(([title, sets, reps, unit, note, days], i) => ({ id: uid(), member_id: m.id, title, detail: "", sets, reps, unit, note, days, how_to: i === 1 ? "바닥에 누워 무릎을 세운다\n엉덩이를 들어 올려 2초 멈춘다\n천천히 내린다" : "", sort: i, active: true, created_at: created }));
    const logs = [], reports = [];
    for (let i = 1; i <= 6; i++) {
      const ds = ymd(addDays(new Date(), -i));
      if (i === 4) continue;
      hs.forEach((h, j) => { if (isScheduled(h, ds) && !(i === 2 && j === 0)) logs.push({ homework_id: h.id, member_id: m.id, done_date: ds }); });
      reports.push({ id: uid(), member_id: m.id, report_date: ds, feeling: [4, 3, 5, 0, 4, 4][i - 1], comment: i === 1 ? "브릿지할 때 허리가 덜 아팠어요!" : "", created_at: addDays(new Date(), -i).toISOString() });
    }
    const others = ["박샘플", "이샘플"].map(name => ({ id: uid(), name, memo: "", token: randTok(), active: true, created_at: created }));
    return { members: [m, ...others], homeworks: hs, logs, reports };
  }
  const memberByToken = t => db().members.find(m => m.token === t && m.active);
  return {
    mode: "demo",
    async session() { return { email: "demo" }; },
    async me() { return { id: "demo-trainer", name: "트레이너", role: "admin" }; },
    async signIn() {}, async signOut() {},
    async listMembers() { return db().members.slice(); },
    async addMember(name, memo) {
      const m = { id: uid(), name, memo: memo || "", token: randTok(), active: true, created_at: new Date().toISOString() };
      db().members.push(m); save(); return m;
    },
    async updateMember(id, patch) { Object.assign(db().members.find(m => m.id === id), patch); save(); },
    async deleteMember(id) {
      const d = db();
      d.members = d.members.filter(m => m.id !== id);
      d.homeworks = d.homeworks.filter(h => h.member_id !== id);
      d.logs = d.logs.filter(l => l.member_id !== id);
      d.reports = d.reports.filter(r => r.member_id !== id);
      save();
    },
    async listHomeworks() { return db().homeworks.filter(h => h.active); },
    async updateHomework(id, fields) { Object.assign(db().homeworks.find(h => h.id === id), fields, { detail: "" }); save(); },
    async addHomework(member_id, { title, sets, reps, unit, note, how_to, days, sort }) {
      const h = { id: uid(), member_id, title, detail: "", sets, reps, unit, note, how_to, days, sort, active: true, created_at: new Date().toISOString() };
      db().homeworks.push(h); save(); return h;
    },
    async deleteHomework(id) { db().homeworks.find(h => h.id === id).active = false; save(); },
    async listLogs(from) { return db().logs.filter(l => l.done_date >= from); },
    async listReports(from) { return db().reports.filter(r => r.report_date >= from); },
    async memberGet(token) {
      const m = memberByToken(token); if (!m) return null;
      const d = db();
      return {
        name: m.name,
        homeworks: d.homeworks.filter(h => h.member_id === m.id && h.active).sort((a, b) => a.sort - b.sort),
        logs: d.logs.filter(l => l.member_id === m.id),
        reports: d.reports.filter(r => r.member_id === m.id),
      };
    },
    async memberToggle(token, hwId, date, done) {
      const m = memberByToken(token); if (!m) throw new Error("bad token");
      const d = db();
      d.logs = d.logs.filter(l => !(l.homework_id === hwId && l.done_date === date));
      if (done) d.logs.push({ homework_id: hwId, member_id: m.id, done_date: date });
      save();
    },
    async memberReport(token, date, feeling, comment) {
      const m = memberByToken(token); if (!m) throw new Error("bad token");
      const d = db();
      d.reports = d.reports.filter(r => !(r.member_id === m.id && r.report_date === date));
      d.reports.push({ id: uid(), member_id: m.id, report_date: date, feeling, comment, created_at: new Date().toISOString() });
      save();
    },
  };
}

/* =========================================================
   데이터 저장소 2) 실제 운영 — Supabase
   ========================================================= */
async function supabaseBackend() {
  const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
  // 좋음PT 센터 관리 화면 안에 들어가 있을 때는 그쪽 로그인을 그대로 씀
  const host = EMBED && window.parent !== window && window.parent.joeumToken ? window.parent : null;
  const sb = host
    ? createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, { accessToken: async () => (await host.joeumToken()) || CONFIG.SUPABASE_ANON_KEY })
    : createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  const ok = ({ data, error }) => { if (error) throw error; return data; };
  return {
    mode: "live",
    async session() {
      if (host) return (await host.joeumToken()) ? host.joeumUser() : null;
      const { data } = await sb.auth.getSession(); return data.session?.user || null;
    },
    async me() {
      const u = await this.session(); if (!u) return null;
      const { data } = await sb.from("profiles").select("id,name,role").eq("id", u.id).maybeSingle();
      return data || { id: u.id, name: u.email, role: null };
    },
    async signIn(email, password) { ok(await sb.auth.signInWithPassword({ email, password })); },
    async signOut() { if (!host) await sb.auth.signOut(); },
    // 회원 목록은 센터 통합 관리(joeum-pt)의 members 테이블을 그대로 사용
    async listMembers() {
      const rows = ok(await sb.from("members").select("id,name,memo,goal,trainer_id,hw_token,created_at").order("name"));
      return rows.map(m => ({ ...m, token: m.hw_token }));
    },
    async listHomeworks() { return ok(await sb.from("hw_homeworks").select("*").eq("active", true).order("sort").order("created_at")); },
    async addHomework(member_id, { title, sets, reps, unit, note, how_to, days, sort }) { return ok(await sb.from("hw_homeworks").insert({ member_id, title, sets, reps, unit, note, how_to, days, sort }).select().single()); },
    async updateHomework(id, fields) { ok(await sb.from("hw_homeworks").update({ ...fields, detail: "" }).eq("id", id)); },
    async deleteHomework(id) { ok(await sb.from("hw_homeworks").update({ active: false }).eq("id", id)); },
    async listLogs(from) { return ok(await sb.from("hw_logs").select("*").gte("done_date", from)); },
    async listReports(from) { return ok(await sb.from("hw_reports").select("*").gte("report_date", from)); },
    async memberGet(token) { return ok(await sb.rpc("hw_member_get", { p_token: token })); },
    async memberToggle(token, hwId, date, done) { ok(await sb.rpc("hw_member_toggle", { p_token: token, p_homework_id: hwId, p_date: date, p_done: done })); },
    async memberReport(token, date, feeling, comment) { ok(await sb.rpc("hw_member_report", { p_token: token, p_date: date, p_feeling: feeling, p_comment: comment })); },
  };
}

/* =========================================================
   회원 화면  (주소 끝에 ?m=회원코드)
   ========================================================= */
async function MemberView(token) {
  document.body.classList.add("member");
  app.innerHTML = loading();
  let data;
  try { data = await api.memberGet(token); }
  catch (e) { app.innerHTML = errorBox("불러오지 못했어요.<br>잠시 후 다시 열어주세요."); return; }
  if (!data) { app.innerHTML = errorBox("링크가 올바르지 않아요.<br>트레이너에게 새 링크를 받아주세요."); return; }
  document.title = `${data.name}님의 운동 숙제`;

  const hws = data.homeworks || [];
  const logSet = new Set((data.logs || []).map(l => l.homework_id + "|" + l.done_date));
  const reports = new Map((data.reports || []).map(r => [r.report_date, r]));
  const st = { day: today(), feeling: 0, comment: "", open: new Set() };
  const loadForm = () => { const r = reports.get(st.day); st.feeling = r?.feeling || 0; st.comment = r?.comment || ""; };
  loadForm();

  function render() {
    const t = today(), y = ymd(addDays(new Date(), -1));
    const sched = hws.filter(h => isScheduled(h, st.day));
    const done = sched.filter(h => logSet.has(h.id + "|" + st.day)).length;
    const pct = sched.length ? Math.round(done / sched.length * 100) : 0;
    const rep = reports.get(st.day);
    const stk = streak(hws, logSet);
    const week = [...Array(7)].map((_, i) => ymd(addDays(new Date(), i - 6)));
    const all = sched.length && done === sched.length;
    const sendLabel = rep ? "수정해서 다시 보내기" : all ? "숙제 완료 알리기 🎉" : done ? "여기까지 했다고 알리기" : "오늘은 못했다고 알리기";

    app.innerHTML = `
      <div class="m-brand">${esc(CONFIG.CENTER_NAME)} · 운동 숙제</div>
      <h1>${esc(data.name)}님,<br>${st.day === t ? "오늘도 같이 해봐요" : "어제 숙제도 체크할 수 있어요"}</h1>
      ${stk ? `<div class="streak">🔥 ${stk}일 연속 완료</div>` : ""}

      <div class="week">${week.map(d => {
        const s = dayStatus(hws, logSet, d).status;
        return `<div class="wd ${s} ${d === t ? "today" : ""}"><span>${d === t ? "오늘" : DOW[parseYmd(d).getDay()]}</span><i></i></div>`;
      }).join("")}</div>

      <div class="seg">
        <button data-day="${y}" class="${st.day === y ? "on" : ""}">어제</button>
        <button data-day="${t}" class="${st.day === t ? "on" : ""}">오늘</button>
      </div>

      ${sched.length ? `
        <div class="card prog">
          <div class="muted small">${fmtDate(st.day)}</div>
          <div class="big">${done} / ${sched.length} 완료</div>
          <div class="bar ${all ? "done" : ""}"><i style="width:${pct}%"></i></div>
        </div>
        <div class="hw-list">${sched.map(h => {
          const on = logSet.has(h.id + "|" + st.day);
          const steps = howSteps(h.how_to), open = st.open.has(h.id);
          return `<div class="hw ${on ? "on" : ""} ${open ? "open" : ""}" data-hw="${h.id}" role="button" aria-pressed="${on}" tabindex="0">
            <span class="chk">${on ? "✓" : ""}</span>
            <span style="flex:1"><b>${esc(h.title)}</b>${hwSpec(h) ? `<span class="spec">${hwSpec(h)}</span>` : ""}${h.note ? `<span class="note">✔ ${esc(h.note)}</span>` : ""}${h.detail ? `<small>${esc(h.detail)}</small>` : ""}
              ${steps.length ? `<span class="howto-btn" data-how="${h.id}">운동 방법 ${open ? "접기 ▴" : "보기 ▾"}</span>` : ""}</span>
          </div>${open && steps.length ? `<div class="howto"><ol>${steps.map(x => `<li>${esc(x)}</li>`).join("")}</ol></div>` : ""}`;
        }).join("")}</div>

        <div class="card">
          <h2>${st.day === t ? "오늘" : "어제"} 운동 어땠어요?</h2>
          <div class="feel">${[1, 2, 3, 4, 5].map(v => `<button data-feel="${v}" class="${st.feeling === v ? "on" : ""}"><span>${FEEL[v].e}</span><small>${FEEL[v].t}</small></button>`).join("")}</div>
          <textarea class="field" id="cmt" rows="3" placeholder="아픈 곳이나 궁금한 점이 있으면 적어주세요 (선택)">${esc(st.comment)}</textarea>
          <button class="btn primary big" id="send" style="margin-top:12px">${sendLabel}</button>
          ${rep ? `<p class="sent-note">✓ 선생님께 전달됐어요</p>` : ""}
        </div>`
      : `<div class="card empty">${st.day === t ? "오늘은" : "어제는"} 숙제 없는 날이에요 😌<br>푹 쉬고 다음에 만나요!</div>`}
    `;

    $$("[data-day]").forEach(b => b.onclick = () => { st.day = b.dataset.day; loadForm(); render(); });
    $$("[data-how]").forEach(b => b.onclick = e => {
      e.stopPropagation();
      const id = b.dataset.how; st.open.has(id) ? st.open.delete(id) : st.open.add(id); render();
    });
    $$("[data-hw]").forEach(b => b.onclick = async () => {
      const id = b.dataset.hw, k = id + "|" + st.day, on = !logSet.has(k);
      on ? logSet.add(k) : logSet.delete(k);
      if (on && navigator.vibrate) navigator.vibrate(12);
      render();
      try { await api.memberToggle(token, id, st.day, on); }
      catch (e) { on ? logSet.delete(k) : logSet.add(k); render(); toast("저장이 안 됐어요. 인터넷을 확인해주세요"); }
    });
    $$("[data-feel]").forEach(b => b.onclick = () => { const v = +b.dataset.feel; st.feeling = st.feeling === v ? 0 : v; render(); });
    const cmt = $("#cmt"); if (cmt) cmt.oninput = () => { st.comment = cmt.value; };
    const send = $("#send");
    if (send) send.onclick = async () => {
      send.disabled = true; send.textContent = "보내는 중…";
      const comment = st.comment.trim();
      try {
        await api.memberReport(token, st.day, st.feeling || null, comment);
        reports.set(st.day, { report_date: st.day, feeling: st.feeling, comment, created_at: new Date().toISOString() });
        celebrate(all, done);
        render();
      } catch (e) { send.disabled = false; send.textContent = "다시 시도하기"; toast("보내지 못했어요. 다시 시도해주세요"); }
    };
  }

  function celebrate(all, done) {
    const el = document.createElement("div");
    el.className = "celebrate";
    el.innerHTML = all ? `<div class="e">💪</div><h2>잘했어요!</h2><p>선생님께 숙제 완료를 알렸어요</p>`
      : done ? `<div class="e">👏</div><h2>수고했어요!</h2><p>한 만큼 선생님께 전달했어요</p>`
      : `<div class="e">🙌</div><h2>알려줘서 고마워요</h2><p>다음엔 같이 해봐요!</p>`;
    el.onclick = () => el.remove();
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2000);
  }
  render();
}

async function TrainerView() {
  document.body.classList.add("trainer");
  if (api.mode === "live" && !(await api.session())) return LoginView();

  const me = await api.me();
  const T = { members: [], hws: [], logs: [], reports: [], logSet: new Set(), sel: null, q: "", mine: me?.role === "trainer" };
  const memberLink = m => `${location.origin}${location.pathname}?m=${m.token}${api.mode === "demo" ? "&demo" : ""}`;
  const hwsOf = id => T.hws.filter(h => h.member_id === id).sort((a, b) => (a.sort ?? 0) - (b.sort ?? 0));
  const repsOf = id => T.reports.filter(r => r.member_id === id);
  const nameOf = id => T.members.find(m => m.id === id)?.name || "(삭제된 회원)";
  // 그날 숙제 결과 판정: 다 함 / 일부 / 못 함 / 소식 없음
  const judge = (memberId, ds) => {
    const s = dayStatus(hwsOf(memberId), T.logSet, ds);
    const rep = T.reports.find(r => r.member_id === memberId && r.report_date === ds);
    if (!s.total) return { k: "rest", cls: "wait", txt: "😌 쉬는 날", s, rep };
    if (s.done === s.total) return { k: "ok", cls: "ok", txt: "✅ 다 했어요", s, rep };
    if (s.done > 0) return { k: "part", cls: "part", txt: `🔸 일부만 (${s.done}/${s.total})`, s, rep };
    if (rep) return { k: "bad", cls: "bad", txt: "❌ 못 했어요", s, rep };
    return ds === today() ? { k: "wait", cls: "wait", txt: "⏳ 아직 소식 없음", s, rep }
                          : { k: "bad", cls: "bad", txt: "❌ 안 함 (보고 없음)", s, rep };
  };
  const pill = j => `<span class="pill ${j.cls}">${j.txt}</span>`;

  async function load() {
    const from = ymd(addDays(new Date(), -30));
    [T.members, T.hws, T.logs, T.reports] = await Promise.all([api.listMembers(), api.listHomeworks(), api.listLogs(from), api.listReports(from)]);
    T.logSet = new Set(T.logs.map(l => l.homework_id + "|" + l.done_date));
    T.reports.sort((a, b) => (b.created_at || "").localeCompare(a.created_at || ""));
  }
  async function refresh() {
    try { await load(); render(); }
    catch (e) { app.innerHTML = errorBox("데이터를 불러오지 못했어요.<br>" + esc(e.message || "")); }
  }

  function render() { T.sel ? renderDetail() : renderHome(); }

    const rows = pool.map(m => {
      const hs = hwsOf(m.id), s = dayStatus(hs, T.logSet, t), j = judge(m.id, t);
      if (hs.length && j.k in cnt) cnt[j.k]++;
      const last = repsOf(m.id)[0];
      return { m, hs, s, j, last };

              <div style="text-align:right;align-self:center"><span class="chip">숙제 주기 →</span></div>
            </button>`;

    app.innerHTML = `
      ${api.mode === "demo" ? `<div class="banner">체험 모드예요 — 데이터가 이 브라우저에만 저장돼요. 주소 끝의 ?demo 를 지우면 실제 센터 데이터로 열려요.</div>` : ""}

        <div class="row">

        <div class="stat ok"><b>${cnt.ok}</b><span>✅ 오늘 다 했어요</span></div>
        <div class="stat part"><b>${cnt.part}</b><span>🔸 일부만 했어요</span></div>
        <div class="stat bad"><b>${cnt.bad}</b><span>❌ 못 했어요</span></div>
        <div class="stat wait"><b>${cnt.wait}</b><span>⏳ 아직 소식 없음</span></div>
      </div>

      <div class="grid2">
        <section>
          <div class="sec-title"><h2>회원 <span class="muted small" style="font-weight:500">${pool.length}명</span></h2>
            ${me?.role === "trainer" || T.members.some(m => m.trainer_id === me?.id) ? `<div class="seg" style="margin:0;width:150px">
              <button data-mine="1" class="${T.mine ? "on" : ""}">내 회원</button><button data-mine="0" class="${!T.mine ? "on" : ""}">전체</button>

          </div>
          <div id="mlist"></div>
        </section>

        <section>
          <div class="sec-title"><h2>최근 보고</h2></div>
          <div class="card feed">
            ${T.reports.length ? T.reports.slice(0, 25).map(r => `
${(() => { const j = judge(r.member_id, r.report_date); return `
              <div class="item ${j.cls === "bad" ? "bad" : ""}">
                <div class="between"><span class="who">${esc(nameOf(r.member_id))}</span><span class="muted small">${relDay(r.report_date)}</span></div>
                <div class="row" style="margin-top:6px;flex-wrap:wrap">${pill(j)}${r.feeling ? `<span class="small muted">${FEEL[r.feeling].e} ${FEEL[r.feeling].t}</span>` : ""}</div>
                ${r.comment ? `<div class="cmt">${esc(r.comment)}</div>` : ""}
              </div>`; })()}`).join("")
            : `<div class="muted small" style="padding:8px 0">회원이 숙제를 보고하면 여기에 쌓여요.</div>`}
          </div>
        </section>
      </div>`;

    $("#reload").onclick = refresh;
    if ($("#logout")) $("#logout").onclick = async () => { await api.signOut(); LoginView(); };
    const openMember = id => { T.sel = id; T.q = ""; render(); window.scrollTo(0, 0); };
    // 목록만 다시 그림 (입력창은 그대로 두어 한글 입력이 끊기지 않게)
    const renderList = () => {
      const q = T.q.trim(), box = $("#mlist");
      const list = q ? rows.filter(r => r.m.name.includes(q)) : rows;
      box.innerHTML = list.length ? list.map(rowHtml).join("")
        : `<div class="card empty">${q ? `'${esc(q)}' 회원이 없어요.<br>회원 등록은 센터 관리 프로그램에서 해주세요.` : T.mine ? "담당 회원이 없어요. '전체'를 눌러보세요." : "등록된 회원이 없어요."}</div>`;
      $$("[data-m]", box).forEach(b => b.onclick = () => openMember(b.dataset.m));
    };
    const qi = $("#q");
    qi.oninput = () => { T.q = qi.value; renderList(); };
    renderList();
    $$("[data-mine]").forEach(b => b.onclick = () => { T.mine = b.dataset.mine === "1"; render(); });
  }

  /* ----- 회원 상세 ----- */
  const FORM0 = () => ({ title: "", sets: 3, reps: 15, unit: "회", note: "", how_to: "", days: [], editId: null, memberId: null });
  let form = FORM0();
  const NOTE_QUICK = ["허리 꺾지 않기", "천천히 내리기", "호흡 멈추지 않기", "통증 있으면 중단", "양쪽 다 하기"];
  function renderDetail() {
    const m = T.members.find(x => x.id === T.sel);
    if (!m) { T.sel = null; return renderHome(); }
    const hs = hwsOf(m.id), reps = repsOf(m.id), link = memberLink(m), t = today();
    if (form.memberId !== m.id || (form.editId && !hs.some(h => h.id === form.editId))) { form = FORM0(); form.memberId = m.id; }
    const dates = [...Array(14)].map((_, i) => ymd(addDays(new Date(), i - 13)));
    const repByDay = new Map(reps.map(r => [r.report_date, r]));
    const kakao = `${m.name}님, 집에서 하는 운동 숙제예요 💪\n운동하고 아래 링크에서 체크만 해주시면 제가 바로 확인할게요!\n👉 ${link}`;

    app.innerHTML = `
      <button class="back" id="back">← 전체 회원</button>
      <div class="t-head">
        <div><h1>${esc(m.name)}</h1>${m.goal || m.memo ? `<div class="muted small">${esc([m.goal, m.memo].filter(Boolean).join(" · "))}</div>` : ""}</div>
        <div class="row" style="flex-wrap:wrap;justify-content:flex-end">${hs.length ? `<span class="muted small">오늘</span>${pill(judge(m.id, t))}` : ""}<span class="chip">🔥 ${streak(hs, T.logSet)}일 연속</span></div>
      </div>

      <div class="grid2">
        <div class="stack">
          <section class="card">
            <div class="sec-title"><h2>숙제 목록</h2><span class="muted small">${hs.length}개</span></div>
            ${hs.length ? hs.map(h => `
              <div class="hwrow ${form.editId === h.id ? "editing" : ""}">
                <div style="min-width:0"><b>${esc(h.title)}</b> <span class="chip">${daysLabel(h.days)}</span>${hwSpec(h) ? `<div class="spec" style="font-size:14px;display:block">${hwSpec(h)}</div>` : ""}${h.note ? `<div class="muted small">✔ ${esc(h.note)}</div>` : ""}${h.detail ? `<div class="muted small">${esc(h.detail)}</div>` : ""}${howSteps(h.how_to).length ? `<ol>${howSteps(h.how_to).map(x => `<li>${esc(x)}</li>`).join("")}</ol>` : ""}</div>
                <div class="row" style="flex:none">
                  <button class="btn ghost" data-edithw="${h.id}" style="padding:7px 10px;font-size:13px">수정</button>
                  <button class="btn ghost" data-delhw="${h.id}" style="padding:7px 10px;font-size:13px">삭제</button>
                </div>
              </div>`).join("") : `<p class="muted small" style="padding:6px 0 10px">아직 숙제가 없어요. 아래에서 추가하세요.</p>`}

            <div class="stack" id="hwForm" style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line)">
              <div class="form-title"><h2 style="font-size:15px">${form.editId ? `✏️ '${esc(hs.find(h => h.id === form.editId)?.title || "")}' 수정 중` : "＋ 새 숙제 추가"}</h2></div>
              <div>
                <div class="lbl">운동 이름</div>
                <input class="field" id="fTitle" placeholder="예: 글루트 브릿지" value="${esc(form.title)}">
              </div>
              <div class="num-grid">
                <div>
                  <div class="lbl">세트</div>
                  <div class="stepper"><button data-step="sets" data-d="-1">−</button><input id="fSets" type="number" inputmode="numeric" min="0" value="${form.sets || ""}" placeholder="-"><button data-step="sets" data-d="1">+</button></div>
                </div>
                <div>
                  <div class="lbl">횟수 / 시간</div>
                  <div class="stepper"><button data-step="reps" data-d="-1">−</button><input id="fReps" type="number" inputmode="numeric" min="0" value="${form.reps || ""}" placeholder="-"><button data-step="reps" data-d="1">+</button></div>
                  <div class="unit">${["회", "초", "분"].map(u => `<button data-unit="${u}" class="${form.unit === u ? "on" : ""}">${u}</button>`).join("")}</div>
                </div>
              </div>
              <div>
                <div class="lbl">체크사항 <span style="font-weight:400">(선택)</span></div>
                <input class="field" id="fNote" placeholder="예: 허리 꺾지 않기, 엉덩이에 힘 주기" value="${esc(form.note)}">
                <div class="quick">${NOTE_QUICK.map(q => `<button data-quick="${esc(q)}">+ ${esc(q)}</button>`).join("")}</div>
              </div>
              <div>
                <div class="lbl">운동 방법 <span style="font-weight:400">(선택 · 한 줄에 한 단계)</span></div>
                <textarea class="field" id="fHow" rows="4" placeholder="예)&#10;바닥에 누워 무릎을 세운다&#10;엉덩이를 들어 올려 2초 멈춘다&#10;천천히 내린다">${esc(form.how_to)}</textarea>
                <div class="muted small" style="margin-top:4px">회원 화면에는 1, 2, 3 번호가 붙어서 보여요.</div>
              </div>
              <div>
                <div class="muted small" style="margin-bottom:6px">하는 요일 — 안 고르면 <b>매일</b></div>
                <div class="days">${WEEK_ORDER.map(d => `<button data-dow="${d}" class="${form.days.includes(d) ? "on" : ""}">${DOW[d]}</button>`).join("")}</div>
              </div>
              <div class="row">
                <button class="btn primary big" id="addHw" style="font-size:16px;padding:14px">${form.editId ? "수정 저장" : "숙제 추가"}</button>
                ${form.editId ? `<button class="btn big" id="cancelEdit" style="font-size:16px;padding:14px;width:auto;flex:none">취소</button>` : ""}
              </div>
            </div>
          </section>

          <section class="card">
            <div class="sec-title"><h2>최근 2주 기록</h2></div>
            ${hs.length ? `<div class="tbl-wrap"><table class="g">
              <thead>
                <tr><th></th>${dates.map(d => `<th class="${d === t ? "today" : ""}">${DOW[parseYmd(d).getDay()]}<br>${parseYmd(d).getDate()}</th>`).join("")}</tr>
              </thead>
              <tbody>
                ${hs.map(h => `<tr><td title="${esc(h.title)}">${esc(h.title)}</td>${dates.map(d => {
                  if (!isScheduled(h, d)) return `<td><span class="c x">·</span></td>`;
                  if (T.logSet.has(h.id + "|" + d)) return `<td><span class="c y">✓</span></td>`;
                  return `<td><span class="c ${d === t ? "p" : "n"}"></span></td>`;
                }).join("")}</tr>`).join("")}
                <tr><td class="muted"><b>결과</b></td>${dates.map(d => { const j = judge(m.id, d); return `<td title="${j.txt}">${{ ok: "✅", part: "🔸", bad: "❌", wait: "", rest: "" }[j.k]}</td>`; }).join("")}</tr>
                <tr><td class="muted">기분</td>${dates.map(d => { const r = repByDay.get(d); return `<td>${r ? (r.feeling ? FEEL[r.feeling].e : "✉️") : ""}</td>`; }).join("")}</tr>
              </tbody>
            </table></div>` : `<p class="muted small">숙제를 추가하면 기록이 표시돼요.</p>`}
          </section>
        </div>

        <div class="stack">
          <section class="card linkbox stack">
            <h2>회원에게 보낼 링크</h2>
            <p class="small muted">회원은 로그인 없이 이 링크만 열면 돼요. 휴대폰 홈 화면에 추가해두면 앱처럼 쓸 수 있어요.</p>
            <input class="field" readonly value="${esc(link)}" onclick="this.select()">
            <div class="row" style="flex-wrap:wrap">
              <button class="btn primary" id="cpKakao">카톡 메시지 복사</button>
              <button class="btn" id="cpLink">링크만 복사</button>
              <a class="btn ghost" href="${esc(link)}" target="_blank" rel="noopener" style="text-decoration:none">회원 화면 보기</a>
            </div>
          </section>

          <section class="card">
            <div class="sec-title"><h2>보고 내역</h2><span class="muted small">최근 30일</span></div>
            <div class="feed">
              ${reps.length ? reps.map(r => `
                <div class="item">
                  <div class="between">${pill(judge(m.id, r.report_date))}<span class="muted small">${fmtDate(r.report_date)}</span></div>
                  ${r.feeling ? `<div class="small muted" style="margin-top:4px">${FEEL[r.feeling].e} ${FEEL[r.feeling].t}</div>` : ""}
                  ${r.comment ? `<div class="cmt">${esc(r.comment)}</div>` : ""}
                </div>`).join("") : `<p class="muted small">아직 보고가 없어요.</p>`}
            </div>
          </section>
        </div>
      </div>`;

    $("#back").onclick = () => { T.sel = null; render(); window.scrollTo(0, 0); };
    $("#cpKakao").onclick = () => copyText(kakao);
    $("#cpLink").onclick = () => copyText(link);
    $("#fTitle").oninput = e => form.title = e.target.value;
    const numIn = { sets: $("#fSets"), reps: $("#fReps") };
    numIn.sets.oninput = e => form.sets = Math.max(0, parseInt(e.target.value) || 0);
    numIn.reps.oninput = e => form.reps = Math.max(0, parseInt(e.target.value) || 0);
    $$("[data-step]").forEach(b => b.onclick = () => {
      const k = b.dataset.step, step = k === "reps" && form.unit === "초" ? 5 : 1;
      form[k] = Math.max(0, (form[k] || 0) + step * +b.dataset.d);
      numIn[k].value = form[k] || "";
    });
    $$("[data-unit]").forEach(b => b.onclick = () => {
      form.unit = b.dataset.unit;
      $$("[data-unit]").forEach(x => x.classList.toggle("on", x === b));
    });
    $("#fHow").oninput = e => form.how_to = e.target.value;
    const noteIn = $("#fNote");
    noteIn.oninput = e => form.note = e.target.value;
    $$("[data-quick]").forEach(b => b.onclick = () => {
      const q = b.dataset.quick;
      if (form.note.includes(q)) return;
      form.note = form.note.trim() ? `${form.note.trim()}, ${q}` : q;
      noteIn.value = form.note;
    });
    $$("[data-dow]").forEach(b => b.onclick = () => {
      const d = +b.dataset.dow;
      form.days = form.days.includes(d) ? form.days.filter(x => x !== d) : [...form.days, d];
      b.classList.toggle("on");
    });
    $("#addHw").onclick = async () => {
      const title = form.title.trim(); if (!title) { $("#fTitle").focus(); return; }
      $("#addHw").disabled = true;
      const fields = { title, sets: form.sets || null, reps: form.reps || null, unit: form.unit, note: form.note.trim(), how_to: form.how_to.trim(), days: form.days.slice().sort((a, b) => a - b) };
      const editing = form.editId;
      try {
        if (editing) await api.updateHomework(editing, fields);
        else await api.addHomework(m.id, { ...fields, sort: hs.length });
        form = FORM0(); form.memberId = m.id;
        await load(); render(); toast(editing ? "수정했어요" : "숙제를 추가했어요");
      } catch (e) { toast(editing ? "수정하지 못했어요" : "추가하지 못했어요"); $("#addHw").disabled = false; }
    };
    if ($("#cancelEdit")) $("#cancelEdit").onclick = () => { form = FORM0(); form.memberId = m.id; render(); };
    $$("[data-edithw]").forEach(b => b.onclick = () => {
      const h = hs.find(x => x.id === b.dataset.edithw); if (!h) return;
      form = { title: h.title, sets: h.sets || 0, reps: h.reps || 0, unit: h.unit || "회",
               note: h.note || (h.detail || ""), how_to: h.how_to || "", days: (h.days || []).slice(), editId: h.id, memberId: m.id };
      render();
      $("#hwForm").scrollIntoView({ behavior: "smooth", block: "start" });
      $("#fTitle").focus({ preventScroll: true });
    });
    $$("[data-delhw]").forEach(b => b.onclick = async () => {
      try { await api.deleteHomework(b.dataset.delhw); await load(); render(); toast("숙제를 뺐어요 (기록은 남아요)"); }
      catch (e) { toast("삭제하지 못했어요"); }
    });
  }

  window.hwRefresh = refresh;   // 센터 관리 화면의 '새로고침' 버튼에서 호출
  app.innerHTML = loading();
  await refresh();
  // 1분마다 자동 새로고침 (대시보드에서 입력 중이 아닐 때만)
  setInterval(() => {
    if (!T.sel && document.visibilityState === "visible" && !document.activeElement?.matches("input,textarea")) refresh();
  }, 60000);
}

/* ---------- 시작 ---------- */
let api;
(async () => {
  const params = new URLSearchParams(location.search);
  const token = params.get("m");
  const demo = params.has("demo") || !(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY);
  try { api = demo ? demoBackend() : await supabaseBackend(); }
  catch (e) { app.innerHTML = errorBox("서버에 연결하지 못했어요.<br>인터넷 연결을 확인해주세요."); return; }
  token ? MemberView(token) : TrainerView();
})();
</script>
</body>
</html>
